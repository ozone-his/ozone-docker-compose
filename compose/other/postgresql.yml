services:

  # PostgreSQL server. On the compose chain when any selected app,
  # integration or mode declares `db: postgresql` (see model.yml).
  postgresql:
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10 -c max_connections=200 -c max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_INIT_LIST: ${DB_INIT_LIST:-}
      # Per-app database credentials consumed by the init scripts in
      # data/postgresql/* are NOT declared here: each owner's fragment
      # (e.g. apps/odoo.yml, apps/senaite.yml, apps/openelis.yml,
      # sso/keycloak.yml) re-declares this service and merges `environment`
      # per key, so they are set exactly when their owner is on the -f
      # chain - which is when the generated .env carries their values.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    image: postgres:13
    networks:
      - ozone
    restart: unless-stopped
    volumes:
      - "${POSTGRES_DATADIR:-postgresql-data}:/var/lib/postgresql/data"
      # The whole data tree is mounted; which DBs are initialized is decided
      # by DB_INIT_LIST (see model.yml), not by what is mounted.
      - "${SQL_SCRIPTS_PATH}/postgresql:/docker-entrypoint-initdb.d/db"
      - "${SQL_SCRIPTS_PATH}/postgresql/create_db.sh:/docker-entrypoint-initdb.d/create_db.sh"
    labels:
      restic-compose-backup.postgres: true

volumes:
  # Default datadir for the evaluation use case; deployments override
  # POSTGRES_DATADIR with a host path instead.
  postgresql-data: ~
