networks:
  ozone:
  web:
    external: true

services:

  env-substitution:
    image: mekomsolutions/env-substitution
    networks:
      - ozone
    restart: on-failure
    volumes:
       - "${DISTRO_PATH}:/opt/env-substitution/files"
    # All substitution env is declared here in one place: the compose model is
    # included unconditionally (see compose.yml), so per-app fragments of this
    # service would conflict. Values come from the generated .env; entries for
    # apps that are not deployed are inert.
    environment:
      # OpenMRS
      - OPENMRS_PUBLIC_URL=${SERVER_SCHEME}://${O3_HOSTNAME}
      # Odoo
      - ODOO_PUBLIC_URL=${SERVER_SCHEME}://${ODOO_HOSTNAME}
      - EXTERNAL_FHIR_API_URL=http://fhir-odoo:8080/odoo/fhir/R4
      - EXTERNAL_FHIR_API_USERNAME=${ODOO_USER}
      - EXTERNAL_FHIR_API_PASSWORD=${ODOO_PASSWORD}
      # Senaite
      - SENAITE_PUBLIC_URL=${SERVER_SCHEME}://${SENAITE_HOSTNAME}
      # OpenELIS
      - OPENELIS_FHIR_SERVER_PUBLIC_URL=${SERVER_SCHEME}://${FHIR_OPENELIS_HOSTNAME}/fhir/
      - OPENELIS_FHIR_SERVER_USERNAME=${OPENELIS_FHIR_SERVER_USERNAME}
      - OPENELIS_FHIR_SERVER_PASSWORD=${OPENELIS_FHIR_SERVER_PASSWORD}
      - ENABLE_SSO=${ENABLE_SSO}
      - OPENELIS_CLIENT_ID=${OPENELIS_CLIENT_ID:-openelis}
      - KEYCLOAK_PUBLIC_URL=${SERVER_SCHEME}://${KEYCLOAK_HOSTNAME}
      - OEG_FACILITY_ID=${OEG_FACILITY_ID}
      - OPENELIS_FHIR_STORE_URL=${OPENELIS_FHIR_STORE_URL}
      # Orthanc
      - ORTHANC_PUBLIC_URL=${SERVER_SCHEME}://${ORTHANC_HOSTNAME}
      # Keycloak realm templating
      - KEYCLOAK_URL=${SERVER_SCHEME}://${KEYCLOAK_HOSTNAME}
      - KEYCLOAK_INTERNAL_HOST_URL=${KEYCLOAK_INTERNAL_HOST_URL}
      - KEYCLOAK_ADMIN_SA_CLIENT_SECRET=${KEYCLOAK_ADMIN_SA_CLIENT_SECRET}
      - EIP_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OPENMRS_CLIENT_UUID=${OPENMRS_CLIENT_UUID}
      - OPENMRS_CLIENT_SECRET=${OPENMRS_CLIENT_SECRET}
      - ODOO_CLIENT_UUID=${ODOO_CLIENT_UUID}
      - ODOO_CLIENT_SECRET=${ODOO_CLIENT_SECRET}
      - SENAITE_CLIENT_UUID=${SENAITE_CLIENT_UUID}
      - SENAITE_CLIENT_SECRET=${SENAITE_CLIENT_SECRET}
      - SUPERSET_PUBLIC_URL=${SERVER_SCHEME}://${SUPERSET_HOSTNAME}
      - SUPERSET_CLIENT_UUID=${SUPERSET_CLIENT_UUID}
      - SUPERSET_CLIENT_SECRET=${SUPERSET_CLIENT_SECRET}
      - SUPERSET_CLIENT_ENABLED=${SUPERSET_CLIENT_ENABLED}
      - OPENELIS_PUBLIC_URL=${SERVER_SCHEME}://${OPENELIS_HOSTNAME}
      - OPENELIS_HOSTNAME=${OPENELIS_HOSTNAME}

volumes:
  mysql-data: ~
  postgresql-data: ~
