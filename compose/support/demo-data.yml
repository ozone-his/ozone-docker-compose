services:

  # One-off demo data seeding: pushes demo patients to OpenMRS. Enabled by
  # the `demo` mode (e.g. the ozone-demo distro), or ad hoc on a running
  # stack via `ozonectl up demo`. The keycloak demo users are seeded by the
  # sso override, sso/demo.yml.
  demo-data:
    image: mekomsolutions/ozone-demo-data
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENMRS_SERVER_URL: http://openmrs:8080/openmrs
      OPENMRS_USERNAME: ${OPENMRS_USER}
      OPENMRS_PASSWORD: ${OPENMRS_PASSWORD}
      OPENMRS_DEMO_DATA_ENABLED: "true"
      OPENMRS_OAUTH_ENABLED: ${ENABLE_SSO}
    restart: on-failure
    networks:
      - ozone
      - web
