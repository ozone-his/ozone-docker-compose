      SMS_TOKEN:
      SMS_ORIGINATOR:
      SMS_PROVIDER_API: "https://api.d7networks.com/messages/v1/send"
      SMS_COUNTRY_CODE:
      # EIP Bahmni client database
      EIP_DB_NAME_BAHMNI: openmrs_eip_mgt_bahmni
      EIP_DB_USER_BAHMNI: openmrs_eip_mgt_bahmni
      EIP_DB_PASSWORD_BAHMNI: password

  senaite:
