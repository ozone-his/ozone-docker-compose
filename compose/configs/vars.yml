      EIP_OPENELIS_FHIR_URL: http://fhir.openelis.org:8080

  orthanc: {}

# One block per integration, named after the catalog entry. These hold the
# values the integration services own (mostly their mgt-database
# credentials), not the values of the apps they integrate.
integrations:
  eip-odoo-openmrs:
    configs:
      EIP_DB_NAME_ODOO: openmrs_eip_mgt_odoo
      EIP_DB_USER_ODOO: openmrs_eip_mgt_odoo
      EIP_DB_PASSWORD_ODOO: password
      EIP_PRODUCT_SYNC_INITIAL_DELAY: 60000
      EIP_PRODUCT_SYNC_DELAY: 86400000
      # TODO: verify where/if these are used - nothing obvious
      DB_EVENT_DESTINATIONS_ODOO: direct:odoo-event-listener
      ODOO_CUSTOMER_EXTERNAL_ID: comment
      ODOO_CUSTOMER_DOB_FIELD:
      ODOO_CUSTOMER_WEIGHT_FIELD:

  eip-openmrs-senaite:
    configs:
      EIP_DB_NAME_SENAITE: openmrs_eip_mgt_senaite
      EIP_DB_USER_SENAITE: openmrs_eip_mgt_senaite
      EIP_DB_PASSWORD_SENAITE: password

  eip-erpnext-openmrs:
    configs:
      EIP_DB_NAME_ERPNEXT: openmrs_eip_mgt_erpnext
      EIP_DB_USER_ERPNEXT: openmrs_eip_mgt_erpnext
      EIP_DB_PASSWORD_ERPNEXT: password

  eip-openmrs-orthanc:
    configs:
      EIP_DB_NAME_ORTHANC: openmrs_eip_mgt_orthanc
      EIP_DB_USER_ORTHANC: openmrs_eip_mgt_orthanc
      EIP_DB_PASSWORD_ORTHANC: password

  eip-odoo-openelis:
    configs:
      EIP_ODOO_OPENELIS_LOG_LEVEL:
      EIP_ODOO_OPENELIS_DATA_DIR:
      EIP_SYNC_TASK_TS_OVERLAP: 45000
      EIP_SYNC_TASK_INITIAL_DELAY: 60000
      EIP_SYNC_TASK_DELAY: 300000
      EIP_ODOO_OPENELIS_URL: http://eip-odoo-openelis:8080

# One block per switchable mode.
modes:
  proxy:
    configs:
      # Maximum body size for file uploads through the nginx proxy
      PROXY_CLIENT_MAX_BODY_SIZE: 10m
      # Extra frame-ancestors origins allowed by the proxy's CSP header
      FRAME_ANCESTORS: ''

  logging-agent:
    configs:
      # Where the agent pushes the collected logs (the logging server,
      # deployed separately). Enabling logging-agent without a value here
      # or at deployment time fails the compose command loudly.
      LOKI_URL: ''

  sso:
    configs:
      KEYCLOAK_DB_USER: keycloak
      KEYCLOAK_DB_PASSWORD: keycloak
      KEYCLOAK_DB: keycloak
      KEYCLOAK_DB_SCHEMA: keycloak
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: password
      KEYCLOAK_INTERNAL_HOST_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_SA_CLIENT_SECRET: 5HuMNB6gwHd0fY2L
      # Superset client is always configured for now
      SUPERSET_CLIENT_ENABLED: false
      SUPERSET_CLIENT_UUID: 891b980a-9edb-4c72-a63d-1f8e488d6ad4
      SUPERSET_CLIENT_SECRET: znZK8dvk7hLOpwfU
    sso:
      # EIP client OAuth credentials, consumed by the SSO overrides of the
      # eip-* integration services
      OAUTH_CLIENT_ID: eip
      OAUTH_CLIENT_SECRET: h9PQzv6zWnVl1yxnhdfZulnW7FPqPlci
      OAUTH_CLIENT_SCOPE: openid
      OAUTH_ACCESS_TOKEN_URL: http://keycloak:8080/realms/ozone/protocol/openid-connect/token

  backup:
    configs:
      RESTIC_KEEP_DAILY: 7
      RESTIC_KEEP_WEEKLY: 4
      RESTIC_KEEP_MONTHLY: 12
      RESTIC_KEEP_YEARLY: 3
      CRON_SCHEDULE: '*/5 * * * *'

  restore:
    configs:
      # The snapshot to restore from
      RESTIC_RESTORE_SNAPSHOT: latest

# The restic repository shared by the backup and restore modes. These values
# are declared exactly once here and are always part of the generated .env,
# so both contexts can never see different repository credentials.
restic:
  configs:
    RESTIC_REPOSITORY: /restic_data
    RESTIC_PASSWORD: password
    LOG_LEVEL: info
    # S3 access (Provide if RESTIC_REPOSITORY points to an S3 bucket)
    AWS_DEFAULT_REGION: eu-west-1
    AWS_ACCESS_KEY_ID:
    AWS_SECRET_ACCESS_KEY:

# The database servers.
databases:
  mysql:
    configs:
      MYSQL_ROOT_PASSWORD: 3cY8Kve4lGey
      MYSQL_MAX_CONNECTIONS: 500

  postgresql:
    configs:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB_HOST: postgresql

  redis:
    configs:
      REDIS_PASSWORD: password
