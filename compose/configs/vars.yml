# ---------------------------------------------------------------------------
# Vars: deployment-overridable values, organized by ownership.
#
# A block declares where a value BELONGS — which app, integration, mode or
# database it is an attribute of. Any compose file may consume any value via
# ${VAR} interpolation; consumption never requires a local declaration, and a
# value is never declared more than once.
#
# Rules:
#   - Var names are globally unique across all blocks.
#   - Compose files may inline defaults as ${VAR:-default}. To override such a
#     value, declare the var in its owner's block below; the generated .env
#     takes precedence over the inline default.
#   - Values a deployment may override belong here, not inlined in the
#     compose files; structural constants of an image belong in the
#     environment section of its compose file.
#   - The `sso:` sections are only merged when SSO is enabled.
# ---------------------------------------------------------------------------

apps:
  openmrs:
    configs:
      # OpenMRS backend
      OMRS_JAVA_SERVER_OPTS: ''
      OMRS_JAVA_MEMORY_OPTS: ''
      # OpenMRS database (consumed by the openmrs and bahmniemr apps, the
      # EIP integration services and the database init scripts)
      OPENMRS_DB_USER: openmrs
      OPENMRS_DB_PASSWORD: password
      OPENMRS_DB_HOST: mysql
      OPENMRS_DB_PORT: 3306
      OPENMRS_DB_NAME: openmrs
      # OpenMRS admin credentials (consumed by the EIP integration services)
      OPENMRS_USER: admin
      OPENMRS_PASSWORD: Admin123
      # Test order type consumed by the EIP flows
      EIP_TEST_ORDER_TYPE_UUID:
      # OpenMRS frontend and backend Docker image tag
      O3_DOCKER_IMAGE_TAG: 3.7.1
    sso:
      OPENMRS_CLIENT_UUID: 14b6083d-2d3c-4fb1-a75d-0f5af17be198
      OPENMRS_CLIENT_SECRET: AYmNV4AEHA0Tlxwa

  bahmniemr:
