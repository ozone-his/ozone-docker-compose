    sso:
      ODOO_CLIENT_UUID: 70a0e2fd-2bb2-4417-9fc6-22cdca1bb5be
      ODOO_CLIENT_SECRET: z3epa8rE66tUIZz6

  erpnext:
    configs:
      ERPNEXT_USER: administrator
      ERPNEXT_PASSWORD: password
      ERPNEXT_DB_NAME: erpnext

  openelis:
    configs:
      # OpenELIS Global
      OPENELIS_DB_SCHEMA: clinlims
      OPENELIS_DB_NAME: clinlims
      OPENELIS_DB_USER: clinlims
      OPENELIS_DB_PASSWORD: password
      OPENELIS_DEFAULT_PASSWORD: adminADMIN!
      OPENELIS_DB_ADMIN_PASSWORD: adminPassword
      # OpenELIS FHIR Server
      OPENELIS_FHIR_SERVER_USERNAME: admin
      OPENELIS_FHIR_SERVER_PASSWORD: adminADMIN!
      # The FHIR store endpoint of the OpenELIS app (deployment-provided)
      OPENELIS_FHIR_STORE_URL:
      OPENELIS_TRAEFIK_LABEL: openelis
      OPENELIS_FHIR_TRAEFIK_LABEL: fhir
      SSL_TRUSTSTORE_PATH: /etc/openelis-global/truststore
      SSL_TRUSTSTORE_PASSWORD: tspass
      SSL_KEYSTORE_PATH: /etc/openelis-global/keystore
      SSL_KEYSTORE_PASSWORD: kspass
