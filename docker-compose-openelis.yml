services:
  certs:
    image: itechuw/certgen:main
    platform: linux/amd64
    restart: on-failure
    environment:
      - KEYSTORE_PW="kspass"
      - TRUSTSTORE_PW="tspass"
    networks:
      - ozone
    volumes:
      - "${OPENELIS_TRUST_STORE:-key_trust-store-volume}:/etc/openelis-global"
      - "${OPENELIS_KEYS:-keys-vol}:/etc/ssl/private/"
      - "${OPENELIS_CERTS:-certs-vol}:/etc/ssl/certs/"

  oe.openelis.org:
    image: itechuw/openelis-global-2:3.2.1.6
    platform: linux/amd64
    depends_on:
      - openelis-postgresql
      - certs
      - env-substitution
    restart: always
    networks:
      ozone:
      web:
    environment:
      DEFAULT_PW: ${OPENELIS_DEFAULT_PASSWORD}
      TZ: ${TZ:-UTC}
      CATALINA_OPTS: "-Ddatasource.url=jdbc:postgresql://${OPENELIS_DB_HOST}:5432/${OPENELIS_DB_NAME} -Ddatasource.username=${OPENELIS_DB_USER} -Ddatasource.password=${OPENELIS_DB_PASSWORD} -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH} -Doe.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD} -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH} -Doe.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}"
      SSL_KEYSTORE_PATH: ${SSL_KEYSTORE_PATH}
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD}
      SSL_TRUSTSTORE_PATH: ${SSL_TRUSTSTORE_PATH}
      SSL_TRUSTSTORE_PASSWORD: ${SSL_TRUSTSTORE_PASSWORD}
      OEG_FACILITY_ID: ${OEG_FACILITY_ID}
      OPENELIS_FHIR_STORE_URL: ${OPENELIS_FHIR_STORE_URL}
    volumes:
      - "${OPENELIS_TRUST_STORE:-key_trust-store-volume}:/etc/openelis-global"
      - "${OPENELIS_CONFIG_PATH}/plugins/:/var/lib/openelis-global/plugins"
      - "${OPENELIS_CONFIG_PATH}/properties:/var/lib/openelis-global/properties"
      - "${OPENELIS_CONFIG_PATH}/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv"
      - "${OPENELIS_CONFIG_PATH}/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv"
      - "${OPENELIS_CONFIG_PATH}/ocl:/var/lib/openelis-global/ocl"
      - "${OPENELIS_LUCENE_INDEX:-lucene_index-vol}:/var/lib/lucene_index"
    secrets:
      - source: common.properties

  fhir.openelis.org:
    image: itechuw/openelis-global-2-fhir:3.2.1.6
    platform: linux/amd64
    depends_on:
      - openelis-postgresql
      - certs
    ports:
      - "${OPENELIS_FHIR_PORT:-9095}:8080"
      - "${OPENELIS_FHIR_SSL_PORT:-9443}:8443"
    networks:
      ozone:
      web:
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${OPENELIS_FHIR_TRAEFIK_LABEL}.rule=Host(`${FHIR_OPENELIS_HOSTNAME}`)"
      - "traefik.http.routers.${OPENELIS_FHIR_TRAEFIK_LABEL}.entrypoints=websecure"
      - "traefik.http.services.${OPENELIS_FHIR_TRAEFIK_LABEL}.loadbalancer.server.port=8080"
    environment:
      TZ: ${TZ:-UTC}
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH}
                      -Djavax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD}
                      -Djavax.net.ssl.trustStoreType=pkcs12
                      -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH}
                      -Djavax.net.ssl.keyStorePassword=${SSL_KEYSTORE_PASSWORD}
                      -Djavax.net.ssl.keyStoreType=pkcs12"
      CATALINA_OPTS: "-Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH} -Dhapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD} -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH} -Dhapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}"
      FHIR_DATASOURCE_URL: "jdbc:postgresql://${OPENELIS_DB_HOST}:5432/${OPENELIS_DB_NAME}?currentSchema=${OPENELIS_DB_SCHEMA}"
      FHIR_DATASOURCE_USERNAME: ${OPENELIS_DB_USER}
      FHIR_DATASOURCE_PASSWORD: ${OPENELIS_DB_PASSWORD}
      FHIR_SERVER_ADRESS: "${FHIR_SERVER_ADRESS:-http://fhir.openelis.org:8080}/fhir/"
    volumes:
      - "${OPENELIS_TRUST_STORE:-key_trust-store-volume}:/etc/openelis-global"
      - "./openelis/tomcat/hapi_server.xml:/opt/bitnami/tomcat/conf/server.xml"

  oe-proxy:
    build:
      context: ./proxy/openelis
    ports:
      - "${OE_PROXY_PUBLIC_PORT:-80}:80"
      - "${OE_PROXY_SSL_PUBLIC_PORT:-443}:443"
    volumes:
      - certs-vol:/etc/nginx/certs/
      - keys-vol:/etc/nginx/keys/
    restart: unless-stopped
    networks:
      - web
      - ozone
    depends_on:
      - certs
      - oe.openelis.org
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${OPENELIS_TRAEFIK_LABEL}.rule=Host(`${OPENELIS_HOSTNAME}`)"
      - "traefik.http.routers.${OPENELIS_TRAEFIK_LABEL}.entrypoints=websecure"
      - "traefik.http.services.${OPENELIS_TRAEFIK_LABEL}.loadbalancer.server.port=80"

  frontend.openelis.org:
    image: itechuw/openelis-global-2-frontend:3.2.1.6
    platform: linux/amd64
    networks:
      ozone:
      web:
    environment:
      - CHOKIDAR_USEPOLLING=true
    tty: true
    restart: unless-stopped

  env-substitution:
    environment:
      - OPENELIS_FHIR_SERVER_PUBLIC_URL=${SERVER_SCHEME}://${FHIR_OPENELIS_HOSTNAME}/fhir/
      - OPENELIS_FHIR_SERVER_USERNAME=${OPENELIS_FHIR_SERVER_USERNAME}
      - OPENELIS_FHIR_SERVER_PASSWORD=${OPENELIS_FHIR_SERVER_PASSWORD}
      - ENABLE_SSO=${ENABLE_SSO}
      - OPENELIS_CLIENT_ID=${OPENELIS_CLIENT_ID:-openelis}
      - KEYCLOAK_PUBLIC_URL=${SERVER_SCHEME}://${KEYCLOAK_HOSTNAME}
      - OEG_FACILITY_ID=${OEG_FACILITY_ID}
      - OPENELIS_FHIR_STORE_URL=${OPENELIS_FHIR_STORE_URL}

  # Dedicated Postgres 13 for OpenELIS (shared postgresql is 16+ for Keycloak).
  # OpenELIS still uses an unquoted system_user table that clashes with PG14+ SYSTEM_USER.
  openelis-postgresql:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPENELIS_DB_NAME: ${OPENELIS_DB_NAME}
      OPENELIS_DB_SCHEMA: ${OPENELIS_DB_SCHEMA}
      OPENELIS_DB_USER: ${OPENELIS_DB_USER}
      OPENELIS_DB_PASSWORD: ${OPENELIS_DB_PASSWORD}
      OPENELIS_DB_ADMIN_PASSWORD: ${OPENELIS_DB_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ozone
    volumes:
      - "${OPENELIS_POSTGRES_DATADIR:-openelis-postgresql-data}:/var/lib/postgresql/data"
      - "${SQL_SCRIPTS_PATH}/postgresql/create_db.sh:/docker-entrypoint-initdb.d/create_db.sh"
      - "${SQL_SCRIPTS_PATH}/postgresql/openelis:/docker-entrypoint-initdb.d/db/openelis"
    labels:
      restic-compose-backup.postgres: true

secrets:
  common.properties:
    file: "${OPENELIS_CONFIG_PATH}/properties/common.properties"

volumes:
  db-data: ~
  openelis-postgresql-data: ~
  key_trust-store-volume: ~
  certs-vol: ~
  keys-vol: ~
  lucene_index-vol: ~
