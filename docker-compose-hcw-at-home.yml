# Shared by every backend process (api, celery, scheduler, migrate, provision).
# They run in separate containers and MUST read the exact same database, Redis,
# storage and secret configuration, otherwise sessions, uploads and background
# tasks silently disagree with each other.
x-backend-env: &backend-env
  DJANGOSECRET_KEY: ${DJANGOSECRET_KEY:-}
  DEBUG: ${DEBUG:-False}
  # Hostnames the backend is allowed to answer for. "*" is fine locally only.
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  # Origins allowed to post to the Django admin, scheme included.
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8082,http://localhost:8082}
  # Extra browser origins allowed to call the API. The frontends are served
  # behind their own Nginx proxy, so they need nothing here.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Timezone applied to newly created users.
  DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-UTC}

  ## Database - PostgreSQL is mandatory, tenants are schemas
  DATABASE_NAME: ${DATABASE_NAME}
  DATABASE_USER: ${DATABASE_USER}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  DATABASE_HOST: ${DATABASE_HOST}
  DATABASE_PORT: ${DATABASE_PORT}

  ## Redis - Celery broker, cache and websocket channel layer
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}

  ## Uploads - absolute path shared by the api and the worker through the same
  ## volume. Unused as soon as the S3 block below is filled in.
  MEDIA_ROOT: ${MEDIA_ROOT:-/var/lib/hcw/uploads}

  ## Email - required to invite patients and to reset passwords
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  # Any non-empty value enables them, "False" included: leave empty to disable.
  # 587 -> TLS, 465 -> SSL, they are mutually exclusive.
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}

  ## Object storage - set the four first ones together or none of them, a
  ## partial configuration aborts startup on purpose
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_REGION: ${S3_REGION:-}
  # MinIO/Ceph buckets that are not a DNS subdomain need "path".
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}

  ## Tokens
  # Access token lifetime in MINUTES, refresh token lifetime in days.
  ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME:-}
  REFRESH_TOKEN_LIFETIME_DAYS: ${REFRESH_TOKEN_LIFETIME_DAYS:-}

  ## Browser push notifications
  WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
  WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
  WEBPUSH_VAPID_CLAIMS_EMAIL: ${WEBPUSH_VAPID_CLAIMS_EMAIL:-}
  # Native mobile push (FCM): uncomment and mount the service account file on
  # api and celery, e.g. ./firebase.json:/etc/hcw/firebase.json:ro
  # GOOGLE_APPLICATION_CREDENTIALS: /etc/hcw/firebase.json

  ## Maintenance mode - answers 503 to every request without touching the
  ## database, requires a restart of api/celery/scheduler to toggle
  MAINTENANCE: ${MAINTENANCE:-False}

  ## Live transcription, only used when enabled per tenant in the admin
  WHISPER_LIVE_URL: ${WHISPER_LIVE_URL:-}
  WHISPER_LIVE_API_KEY: ${WHISPER_LIVE_API_KEY:-}

x-backend-image: &backend-image docker.io/iabsis/hcw6-backend:${TAG:-latest}

x-backend-depends: &backend-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

# Uploads must be reachable by the api and by the worker alike. The container
# runs as uid 1000, so the host directory has to be writable by it:
#   mkdir -p data/uploads && sudo chown 1000:1000 data/uploads
x-uploads-volume: &uploads-volume
  - ./data/uploads:/var/lib/hcw/uploads

services:

  migrate:
    image: *backend-image
    command: >
      sh -c "
        echo 'Running migrations...';
        python manage.py migrate;
        echo 'Migration completed successfully';
      "
    environment:
      <<: *backend-env
    depends_on: *backend-depends
    restart: "no"

  provision:
    image: *backend-image
    command: python manage.py bootstrap_tenant
    environment:
      <<: *backend-env
      # Tenant and public URLs
      TENANT_SCHEMA: ${TENANT_SCHEMA:-default}
      TENANT_NAME: ${TENANT_NAME:-HCW@Home}
      TENANT_PRIMARY_DOMAIN: ${TENANT_PRIMARY_DOMAIN:-localhost}
      TENANT_PATIENT_DOMAIN: ${TENANT_PATIENT_DOMAIN:-}
      TENANT_ADMIN_DOMAIN: ${TENANT_ADMIN_DOMAIN:-}
      PRACTITIONER_BASE_URL: ${PRACTITIONER_BASE_URL:-http://localhost:8080}
      PATIENT_BASE_URL: ${PATIENT_BASE_URL:-http://localhost:8081}
      # Superuser, change the password before any real deployment
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@example.com}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-admin}
      # LiveKit media server, skipped when the three values are empty
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Sender of the email messaging provider, falls back to EMAIL_HOST_USER
      MESSAGING_FROM_EMAIL: ${MESSAGING_FROM_EMAIL:-}
      # Keycloak / OpenID Connect, skipped when client id or server url is empty
      SSO_PROVIDER_ID: ${SSO_PROVIDER_ID:-openid}
      SSO_NAME: ${SSO_NAME:-Keycloak}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_SERVER_URL: ${SSO_SERVER_URL:-}
      SSO_DISABLE_PASSWORD_LOGIN: ${SSO_DISABLE_PASSWORD_LOGIN:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: backend
      target: api
    image: *backend-image
    restart: always
    environment:
      <<: *backend-env
    volumes: *uploads-volume
    depends_on: *backend-depends
    healthcheck:
      # /api/health/ answers before tenant resolution and probes PostgreSQL and
      # Redis. Turns unhealthy while MAINTENANCE is on, which is intended.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin:
    build:
      context: backend
      target: admin
    image: docker.io/iabsis/hcw6-admin:${TAG:-latest}
    restart: always
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-8082}:8080"
    healthcheck:
      # Served by Nginx itself, stays green even when the api is down
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery:
    entrypoint: celery -A core.celery worker --loglevel=info
    image: *backend-image
    restart: always
    environment:
      <<: *backend-env
    volumes: *uploads-volume
    depends_on: *backend-depends
    healthcheck:
      # Round trip through the broker, targeting this worker only: a healthy
      # sibling must not be able to mask a dead one.
      test: ["CMD-SHELL", "celery -A core.celery inspect ping -d celery@$$(hostname) --timeout 10 > /dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  scheduler:
    entrypoint: celery -A core beat --loglevel=info
    image: *backend-image
    restart: always
    environment:
      <<: *backend-env
    depends_on: *backend-depends
    healthcheck:
      # Celery beat has no remote control API: check the process is still there.
      # The [c] pattern keeps pgrep from matching its own shell.
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*beat' > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  patient:
    build:
      context: patient
      target: patient
    image: docker.io/iabsis/hcw6-patient:${TAG:-latest}
    restart: always
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PATIENT_PORT:-8081}:8081"
    healthcheck:
      # Serves the SPA locally, no backend call involved
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  practitioner:
    build:
      context: practitioner
      target: practitioner
    image: docker.io/iabsis/hcw6-practitioner:${TAG:-latest}
    restart: always
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PRACTITIONER_PORT:-8080}:8080"
    healthcheck:
      # Serves the SPA locally, no backend call involved
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
