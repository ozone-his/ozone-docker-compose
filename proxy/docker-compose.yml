services:
  proxy:
    build:
      context: ${PROXY_BUILD_CONTEXT:-./}
      args:
        TIMEZONE: "${TIMEZONE}"
    environment:
      - GITPOD_ENV=${GITPOD_ENV}
      - PROXY_CLIENT_MAX_BODY_SIZE=${PROXY_CLIENT_MAX_BODY_SIZE:-10m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
    networks:
      - ozone
      - web
    ports:
      - "${PROXY_PUBLIC_PORT:-80}:80"
      - "${ODOO_PROXY_PORT:-8069}:8069"
      - "${SENAITE_PROXY_PORT:-8081}:8081"
      - "${ERPNEXT_PROXY_PORT:-8082}:8082"
      - "${FHIR_ODOO_PROXY_PORT:-8083}:8083"
      - "${KEYCLOAK_PROXY_PORT:-8084}:8084"
    restart: unless-stopped
    volumes:
      - "./confs:/usr/local/apache2/conf/extra"
      - "${PROXY_TLS_CERTS_PATH:-proxy-tls-certs}:/etc/tls"

volumes:
  proxy-tls-certs: ~

networks:
  ozone:
  web:
    external: true
